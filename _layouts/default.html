<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'ko' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M' }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='none' stroke='%2364ffb4' stroke-width='10'/><circle cx='50' cy='50' r='10' fill='%2364ffb4'/></svg>">
  {% if page.layout == 'home' or page.url == '/' %}
  <script defer src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
  <script defer src="{{ '/assets/js/home-sketch.js' | relative_url }}"></script>
  <script defer src="{{ '/assets/js/home-filter.js' | relative_url }}"></script>
  {% endif %}
</head>
<body class="{{ page.body_class | default: '' }}">
  {% include nav.html %}
  {{ content }}
  {% include footer.html %}
</body>
</html>
