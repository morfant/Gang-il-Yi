# Site settings
title: "이강일 Gang il Yi"
description: "이강일 Gang il Yi — sound artist. Performances, installations, generative works."
url: "https://gangilyi.xyz"
baseurl: ""
locale: "ko-KR"
lang: "ko"

author:
  name: "이강일 Gang il Yi"
  email: "giy.hands@gmail.com"

# Projects collection — 프로젝트 페이지는 _projects/ 아래 마크다운 파일 하나씩
collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# Conversion
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true

encoding: "utf-8"
timezone: Asia/Seoul

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - CLAUDE.md
  - 사이트-관리-가이드.md
  - _admin_helper.py
