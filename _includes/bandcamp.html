{% comment %}
Bandcamp 임베드: 앨범/트랙 숫자 ID가 필요합니다.
Bandcamp 앨범 페이지 → Share/Embed → embed 코드 안의 album=숫자 (또는 track=숫자)를 복사하세요.
{% endcomment %}
<div class="embed audio">
  {% if include.track %}
  <iframe src="https://bandcamp.com/EmbeddedPlayer/track={{ include.track }}/size=large/bgcol=0e0e10/linkcol=64ffb4/tracklist=false/artwork=small/transparent=true/"
    title="Bandcamp player" loading="lazy" seamless></iframe>
  {% else %}
  <iframe src="https://bandcamp.com/EmbeddedPlayer/album={{ include.album }}/size=large/bgcol=0e0e10/linkcol=64ffb4/tracklist=false/artwork=small/transparent=true/"
    title="Bandcamp player" loading="lazy" seamless></iframe>
  {% endif %}
</div>
