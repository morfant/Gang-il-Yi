# period 쓰는 법: "2024.10" / "2022.07 – 08" / "2019.11 – 2020.01" / "2024.09 –" (진행 중)
#   → 정렬은 앞의 연도.월로 하므로 항상 연도부터 적어 주세요.
# 각 항목은 ko / en 한 줄씩. url 은 선택.

