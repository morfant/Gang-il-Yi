# CV 데이터
# ─────────────────────────────────────────────────────────────────
# CV 페이지(/cv/, /cv/en/)는 두 곳에서 항목을 모아 만듭니다.
#   1) _projects/*.md 의 front matter  ← 작업(전시·공연·무용음악 등). 각 파일의 cv: 값으로 섹션이 정해집니다.
#   2) 이 파일의 items                 ← 작업 페이지가 없는 항목(워크숍, 기금, 학력, 경력…)
